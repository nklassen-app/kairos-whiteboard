<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Charter v1.6 (Pace 6): the page may reach its own address and one other,
     api.github.com, for the Kairos door below. Any other host is refused. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Whiteboard">
<title>Whiteboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --board:#f6f7f5;
    --edge:#d3d6d1;
    --ink:#000000;
    --graphite:#5a6067;
    --blue:#1b54b8;
    --red:#d5322b;
    --green:#1f7a4c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.4;
    padding:20px 16px 56px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px;}
  h1{font-size:21px;font-weight:650;letter-spacing:-.3px;margin:0;}
  .count{font-size:14px;font-weight:600;color:var(--graphite);font-variant-numeric:tabular-nums;}
  .count.full{color:var(--red);}

  section{margin-bottom:34px;}
  h2{font-size:13px;font-weight:650;color:var(--graphite);margin:0 0 10px;letter-spacing:.1px;}

  .board{border:1.5px solid var(--edge);border-radius:10px;background:#fff;padding:4px 0;}
  .board.empty{padding:22px 16px;color:var(--graphite);font-size:14px;border-style:dashed;}

  .row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;}
  .row + .row{border-top:1px solid #ecefea;}
  .task{flex:1;font-size:16px;word-break:break-word;padding-top:1px;}

  .box{
    width:23px;height:23px;flex:none;margin-top:1px;border:2px solid var(--ink);
    border-radius:4px;background:#fff;cursor:pointer;padding:0;position:relative;
  }
  .box svg{position:absolute;inset:-3px;width:29px;height:29px;stroke:var(--green);
    stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:32;stroke-dashoffset:32;}
  .done .box{border-color:var(--graphite);}
  .done .box svg{stroke-dashoffset:0;transition:stroke-dashoffset .22s ease-out;}
  .done .task{color:var(--graphite);text-decoration:line-through;text-decoration-color:#b9bdb7;}
  .done{opacity:.35;transition:opacity .25s ease-out .2s;}
  .task{cursor:text;}
  .edit{
    flex:1;min-width:0;font:inherit;font-size:16px;padding:0;margin:0;border:none;border-bottom:1.5px solid var(--ink);
    background:transparent;color:var(--ink);border-radius:0;
  }
  .edit:focus{outline:none;border-color:var(--ink);}
  .backlog .edit{font-size:15px;}

  .push{
    flex:none;border:1.5px solid var(--blue);color:var(--blue);background:#fff;
    font:inherit;font-size:13px;font-weight:600;border-radius:6px;padding:5px 11px;cursor:pointer;
  }
  .push:disabled{border-color:var(--edge);color:#adb2ac;cursor:not-allowed;}

  .capture{display:flex;gap:8px;margin-bottom:12px;}
  input{
    flex:1;font:inherit;font-size:16px;padding:11px 13px;background:#fff;
    border:1.5px solid var(--edge);border-radius:8px;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--ink);}
  .add{border:none;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:600;
    border-radius:8px;padding:0 16px;cursor:pointer;}

  .backlog .row{padding:11px 2px;}
  .backlog .row + .row{border-top:1px solid #e6e9e4;}
  .backlog .task{font-size:15px;}
  .note{font-size:13px;color:var(--graphite);margin:10px 2px 0;}
  .age{flex:none;font-size:12px;color:var(--graphite);font-variant-numeric:tabular-nums;padding-top:4px;white-space:nowrap;}
  .copy{flex:none;font:inherit;font-size:12px;color:var(--graphite);background:#fff;border:1.5px solid var(--edge);border-radius:6px;padding:3px 8px;cursor:pointer;}
  .copy.did{color:var(--green);border-color:var(--green);}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .prog{align-self:flex-start;max-width:100%;font:inherit;font-size:12px;color:var(--graphite);background:#fff;
    border:1.5px solid var(--edge);border-radius:6px;padding:2px 4px;}
  .prog.set{color:var(--blue);border-color:#b8c8e6;}
  details{margin-bottom:22px;}
  summary{font-size:13px;font-weight:650;color:var(--graphite);cursor:pointer;padding:4px 0;}
  .archive .row,.programs .row{padding:9px 2px;}
  .archive .row + .row,.programs .row + .row{border-top:1px solid #e6e9e4;}
  .archive .task{font-size:14px;color:var(--graphite);cursor:default;}
  .archive .meta{display:block;font-size:12px;color:var(--graphite);opacity:.8;}
  .programs .task{font-size:14px;}
  .programs textarea{flex:1;font:inherit;font-size:15px;padding:9px 12px;background:#fff;resize:vertical;
    border:1.5px solid var(--edge);border-radius:8px;color:var(--ink);min-height:44px;}
  .programs textarea:focus{outline:none;border-color:var(--ink);}
  /* Export for agent (Agent design 5): the document shown before it is copied */
  .export{margin-top:22px;}
  .export .xdoc{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1.5px solid var(--edge);border-radius:8px;padding:10px 12px;margin:8px 0 0;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto;}
  .export .btns{display:flex;gap:8px;margin-top:8px;}
  /* Kairos (Pace 6): the ready steps from the dashboard issue, read only */
  .kairos{margin-top:22px;}
  .kairos .row{padding:10px 2px;}
  .kairos .row + .row{border-top:1px solid #e6e9e4;}
  .kairos .task{font-size:15px;cursor:default;}
  .kairos .meta{display:block;font-size:12px;color:var(--graphite);opacity:.8;}
  .kairos details{margin:10px 0 0;}
  .kairos input{min-width:0;}
  .ver{position:fixed;right:10px;bottom:8px;font-size:11px;color:var(--graphite);opacity:.6;}
  .saving{font-size:12px;color:var(--graphite);}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Whiteboard</h1>
    <span class="count" id="count"></span>
  </header>

  <section>
    <h2>Now</h2>
    <div class="board" id="active"></div>
  </section>

  <section class="kairos">
    <h2 id="kairos-head">Kairos</h2>
    <div id="kairos"></div>
    <p class="note" id="kairos-note"></p>
    <details id="kairos-connect">
      <summary>Connect to Kairos</summary>
      <p class="note">Paste a fine-grained GitHub token: only <b>kairos_v3</b>, Issues read and write, 90 days. It stays on this phone and is never exported.</p>
      <div class="capture" style="margin-top:8px">
        <input id="kairos-token" type="password" placeholder="github_pat_…" autocomplete="off">
        <button class="add" id="kairos-save" type="button">Connect</button>
      </div>
    </details>
  </section>

  <section class="backlog">
    <h2>Backlog</h2>
    <div class="capture">
      <input id="field" placeholder="Add a task" autocomplete="off" enterkeyhint="done">
      <button class="add" id="add" type="button">Add</button>
    </div>
    <div id="backlog"></div>
    <p class="note" id="status"></p>
  </section>

  <details class="archive" id="archive-box">
    <summary id="archive-head">Archive</summary>
    <div id="archive"></div>
  </details>

  <details class="programs" id="programs-box">
    <summary id="programs-head">Programs</summary>
    <div class="capture">
      <textarea id="prog-field" rows="1" placeholder="Add programs, one per line" autocomplete="off"></textarea>
      <button class="add" id="prog-add" type="button">Add</button>
    </div>
    <div id="programs"></div>
  </details>

  <section class="export">
    <button class="add" id="export" type="button">Export for agent</button>
    <div id="export-box" hidden>
      <h2 style="margin-top:14px">This is what leaves the phone</h2>
      <p class="note" id="export-note"></p>
      <pre class="xdoc" id="export-doc"></pre>
      <div class="btns"><button class="add" id="export-copy" type="button">Copy</button><button class="copy" id="export-close" type="button">Close</button></div>
    </div>
  </section>
</div>
<!-- Keep in step with CACHE in sw.js — the visible proof of which build is running. -->
<span class="ver">whiteboard-v9</span>

<script>
const KEY = 'whiteboard:v1';
// archive: ticked tasks, newest first, each with `done` (epoch ms).
// programs: the short list typed on the phone ({id, name}); a task names one
// by `program` (its id). It starts from DEFAULT_PROGRAMS, below.
// (no `programs` key until load() decides: absent means "never had a list")
let state = { active: [], backlog: [], archive: [] };
// The starting program list: generic topics every household deals with — not
// sensitive (N., 2026-10-03), so it ships in this repo. A board that has never
// had a program list gets it on first load; a list already started on the
// device is never touched. Edit it on the phone (add, rename) from there.
const DEFAULT_PROGRAMS = [
  "Working with healthcare providers",
  "Supporting family endeavours",
  "Wider family touchpoints",
  "Shared adventures and cultural immersion",
  "Creative Home",
  "Preserve and strengthen family foundations",
  "Engaging my advisory board",
  "Curating primary house as a lab",
  "Curating a nature retreat outside",
  "Managing home support team",
  "Project 29: School prep"
];

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const openCount = () => state.active.length;
// How long a task has been on Now: `since` (epoch ms) is set when it is
// pushed up. Tasks that were on Now before there was a `since` get stamped
// at their first load after the update — the earliest moment known.
// Counted in calendar days, not elapsed hours: a task pushed up at 8pm is
// on Now for a second calendar day the moment the clock crosses midnight,
// not 24 hours later. (Math.round rather than a plain subtract/DAY so a
// DST shift, which makes a local day worth 23 or 25 real hours, doesn't
// push the count off by one.)
const DAY = 86400000;
const daysOn = t => {
  if (!t.since) return null;
  const since = new Date(t.since), now = new Date();
  const sinceMidnight = new Date(since.getFullYear(), since.getMonth(), since.getDate()).getTime();
  const nowMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  return Math.round((nowMidnight - sinceMidnight) / DAY);
};
const age = t => { const d = daysOn(t); return d == null ? '' : d <= 0 ? 'today' : d === 1 ? '1 day' : d + ' days'; };

async function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) {
    $('status').textContent = 'Starting a fresh board.';
  }
  if (!Array.isArray(state.active)) state.active = [];
  if (!Array.isArray(state.backlog)) state.backlog = [];
  if (!Array.isArray(state.archive)) state.archive = [];
  let seeded = false;
  if (!Array.isArray(state.programs)){
    state.programs = DEFAULT_PROGRAMS.map((name, i) => ({ id: 'd' + i, name }));
    seeded = true;
  }
  let stamped = false;
  for (const t of state.active) if (!t.since){ t.since = Date.now(); stamped = true; }
  render();
  if (stamped || seeded) save();
}

async function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    $('status').textContent = '';
  } catch (e) {
    $('status').textContent = 'Not saved — this browser is blocking storage.';
  }
}

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const programName = id => (state.programs.find(p => p.id === id) || {}).name || '';
// The day a task was ticked: "3 Oct", with the year once it is not this year's.
const doneDay = ms => {
  const d = new Date(ms), opts = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('en-GB', opts);
};
// The program picker under a task's text — only once there is a program list.
function picker(t){
  if (!state.programs.length) return '';
  const opts = state.programs.map(p => `<option value="${p.id}" ${t.program === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  return `<select class="prog${t.program ? ' set' : ''}" data-prog="${t.id}" aria-label="Program for ${esc(t.text)}"><option value="">no program</option>${opts}</select>`;
}

function render(){
  const n = openCount();
  const c = $('count');
  c.textContent = n + ' / 7';
  c.classList.toggle('full', n >= 7);

  const a = $('active');
  if (!state.active.length){
    a.className = 'board empty';
    a.textContent = 'Nothing here. Push something up from the backlog.';
  } else {
    a.className = 'board';
    a.innerHTML = state.active.map(t => `
      <div class="row" data-row="${t.id}">
        <button class="box" data-done="${t.id}" aria-label="Complete ${esc(t.text)}">
          <svg viewBox="0 0 29 29"><path d="M7 15.2 12.2 20.4 22 9.4"/></svg>
        </button>
        <div class="body"><span class="task" data-edit="${t.id}">${esc(t.text)}</span>${picker(t)}</div>
        <span class="age" data-age="${t.id}">${age(t)}</span>
        <button class="copy" data-copy="${t.id}" aria-label="Copy ${esc(t.text)}">copy</button>
      </div>`).join('');
  }

  const b = $('backlog');
  b.innerHTML = state.backlog.length
    ? state.backlog.map(t => `
      <div class="row" data-row="${t.id}">
        <div class="body"><span class="task" data-edit="${t.id}">${esc(t.text)}</span>${picker(t)}</div>
        <button class="copy" data-copy="${t.id}" aria-label="Copy ${esc(t.text)}">copy</button>
        <button class="push" data-push="${t.id}" ${n >= 7 ? 'disabled' : ''}>Now</button>
      </div>`).join('')
    : '<p class="note">Empty.</p>';

  $('archive-head').textContent = `Archive · ${state.archive.length}`;
  $('archive').innerHTML = state.archive.length
    ? state.archive.map(t => `
      <div class="row" data-row="${t.id}">
        <span class="task">${esc(t.text)}<span class="meta">${doneDay(t.done)}${t.program && programName(t.program) ? ' · ' + esc(programName(t.program)) : ''}</span></span>
      </div>`).join('')
    : '<p class="note">Nothing ticked off yet.</p>';

  $('programs-head').textContent = `Programs · ${state.programs.length}`;
  $('programs').innerHTML = state.programs.length
    ? state.programs.map(p => `
      <div class="row"><span class="task" data-prog-edit="${p.id}">${esc(p.name)}</span></div>`).join('')
    : '<p class="note">None yet. Add the programs you do Whiteboard tasks for.</p>';
  renderExport();
}

/* ---- Kairos (Pace 6, Charter v1.6): the dashboard issue, read on the phone ---- */

// The Whiteboard's one outbound door. kairosDoor() is the only network call
// in this page, and it reaches exactly one address: issue #11 of
// nklassen-app/kairos_v3, the dashboard. The CSP in <head> refuses any other
// host. It only reads (the write-back of a tick is the next story); nothing
// of the board is ever sent. The token sits under its own key, outside the
// board's document, so no export or copy can carry it.
const TOKEN_KEY = 'whiteboard:kairos-token';   // { token, since }
const KAIROS_KEY = 'whiteboard:kairos';         // the last list read: { at, tasks }
const ISSUE = 'https://api.github.com/repos/nklassen-app/kairos_v3/issues/11';
const TOKEN_DAYS = 90, WARN_DAYS = 30;

const readKey = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const writeKey = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

async function kairosDoor(token){
  const res = await fetch(ISSUE, { method: 'GET', cache: 'no-store', headers: {
    Authorization: 'Bearer ' + token,
    Accept: 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  } });
  if (!res.ok){ const err = new Error('refused'); err.status = res.status; throw err; }
  return (await res.json()).body || '';
}

// The dashboard's own lines (dashboard.py): an epic line "**Epic** — …" and
// N.'s open steps "- [ ] Story · task <!-- k:… -->". Ticked boxes, the
// "Recently done" list and everything else are skipped.
function kairosTasks(body){
  const tasks = [];
  let epic = '';
  for (const line of body.split(/\r?\n/)){
    if (line.startsWith('### Recently done')) break;
    const e = line.match(/^\*\*(.+?)\*\* — /);
    if (e){ epic = e[1]; continue; }
    const m = line.match(/^- \[ \] (.*?)\s*<!-- k:([0-9a-f]{10}) -->\s*$/);
    if (!m) continue;
    const plain = m[1].replace(/\*\*|`/g, '').trim();
    const s = plain.match(/^(.+? \d+[a-z]?|On trial) · (.*)$/);
    tasks.push({ key: m[2], epic, story: s ? s[1] : '', text: s ? s[2] : plain });
  }
  return tasks;
}

const clock = ms => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const sinceDays = ms => Math.floor((Date.now() - ms) / DAY);

function renderKairos(note){
  const list = readKey(KAIROS_KEY);
  const tasks = (list && list.tasks) || [];
  $('kairos-head').textContent = list ? `Kairos · ${tasks.length}` : 'Kairos';
  $('kairos').innerHTML = tasks.length
    ? tasks.map(t => `
      <div class="row" data-kairos="${t.key}">
        <span class="task">${esc(t.text)}<span class="meta">${esc(t.epic)}${t.story && t.story !== 'On trial' ? ' · ' + esc(t.story) : ''}</span></span>
      </div>`).join('')
    : list ? '<p class="note">Nothing waits on you.</p>' : '';
  $('kairos-note').textContent = note || '';
}

async function kairosRefresh(){
  const t = readKey(TOKEN_KEY);
  if (!t || !t.token){
    $('kairos-connect').open = true;
    renderKairos('Not connected. Your Kairos tasks show here once this phone holds a token.');
    return;
  }
  const left = TOKEN_DAYS - sinceDays(t.since);
  const expiry = left <= 0 ? ' The token may have run out: make a new one (90 days) and connect again.'
    : left <= WARN_DAYS ? ` The token runs out in ${left} day${left === 1 ? '' : 's'}: make a new one and connect again.` : '';
  try {
    const tasks = kairosTasks(await kairosDoor(t.token));
    writeKey(KAIROS_KEY, { at: Date.now(), tasks });
    renderKairos(expiry.trim());
  } catch (err){
    const list = readKey(KAIROS_KEY);
    if (err.status === 401){
      $('kairos-connect').open = true;
      renderKairos('GitHub refused the token: it has run out or was revoked. Make a new one (90 days) and connect again.');
    } else {
      renderKairos((list ? `Could not reach GitHub. This is the list from ${doneDay(list.at)}, ${clock(list.at)}.` : 'Could not reach GitHub.') + expiry);
    }
  }
}

function kairosConnect(){
  const token = $('kairos-token').value.trim();
  if (!/^github_pat_\w+$/.test(token)){
    $('kairos-note').textContent = 'That is not a fine-grained token: they start with github_pat_.';
    return;
  }
  writeKey(TOKEN_KEY, { token, since: Date.now() });
  $('kairos-token').value = '';
  $('kairos-connect').open = false;
  kairosRefresh();
}

/* ---- Export for agent (Agent design 5): the one door for what an agent gets, copied by hand ---- */

// Everything that leaves the Whiteboard for an agent is built here, from an
// allow-list. In: the text and program name of each task on Now (with its
// days there) and on the backlog, and two counts — tasks ticked off this
// week, and tasks held back. Only tasks under a program in SHARED cross;
// everything else is held back and only counted: the health, family and
// school defaults (d0, d1, d2, d5, d10 — Crown jewels, N., 2026-10-19), any
// program added later (until N. allows it), and tasks with no program
// (N., 2026-10-20). By id, so a renamed program keeps its class. Out,
// always: the archive's text, ids and timestamps. Nothing goes over the
// network — the panel shows the document and N. copies it by hand.
const SHARED = new Set(['d3', 'd4', 'd6', 'd7', 'd8', 'd9']);
let exportOpen = false;
function agentExport(){
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() + 6) % 7).getTime();
  const shared = t => SHARED.has(t.program);
  const all = state.active.concat(state.backlog);
  return {
    app: 'whiteboard',
    exported: `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`,
    about: 'N.\'s own tasks. now: on the Now list (at most seven), with days there; next: the backlog. held_back: tasks under private programs, left out on purpose.',
    now: state.active.filter(shared).map(t => ({ text: t.text, program: programName(t.program), days_on_now: daysOn(t) })),
    next: state.backlog.filter(shared).map(t => ({ text: t.text, program: programName(t.program) })),
    done_this_week: state.archive.filter(t => t.done >= monday).length,
    held_back: all.filter(t => !shared(t)).length,
  };
}
const agentText = () => JSON.stringify(agentExport(), null, 2) + '\n';
function renderExport(){
  $('export-box').hidden = !exportOpen;
  $('export').hidden = exportOpen;
  if (!exportOpen) return;
  const x = agentExport();
  $('export-note').textContent = `Tasks on Now and the backlog under your shared programs. ${x.held_back} held back (private programs, or no program); the archive's text stays here.`;
  $('export-doc').textContent = agentText();
}
function copyExport(){
  const text = agentText();
  const btn = $('export-copy');
  const did = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy'; }, 1200); };
  const fail = () => { $('export-note').textContent = 'Could not copy — select the text and copy it by hand.'; };
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(did, fail); return; }
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand && document.execCommand('copy'); } catch (e) {}
  ta.remove(); (ok ? did : fail)();
}

function add(){
  const field = $('field');
  const text = field.value.trim();
  if (!text) return;
  state.backlog.push({ id: newId(), text });
  field.value = '';
  field.focus();
  render(); save();
}

// A pasted list, one item per line: list bullets are stripped, and a
// heading line ending in ":" and an empty line are skipped.
const listLines = text => text.split(/\r?\n/)
  .map(line => line.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim())
  .filter(line => line && !line.endsWith(':'));

// Paste several tasks into the task field — one per line (a list Claude
// hands over: N.'s ready steps, `dashboard.py --tasks`). Each lands on the
// backlog; a task already on Now or the backlog (any case) is not added
// twice. A one-line paste is an ordinary paste.
function pasteTasks(e){
  const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
  if (!/\n/.test(text.trim())) return;
  e.preventDefault();
  const have = new Set([...state.active, ...state.backlog].map(t => t.text.toLowerCase()));
  let n = 0;
  for (const line of listLines(text)){
    if (have.has(line.toLowerCase())) continue;
    have.add(line.toLowerCase());
    state.backlog.push({ id: newId(), text: line });
    n++;
  }
  render(); save();
  $('status').textContent = `${n} task${n === 1 ? '' : 's'} added from the list.`;
}

// Add one program, or paste several (listLines); a name already on the
// list (any case) is not added twice.
function addPrograms(){
  const field = $('prog-field');
  const have = new Set(state.programs.map(p => p.name.toLowerCase()));
  for (const name of listLines(field.value)){
    if (have.has(name.toLowerCase())) continue;
    have.add(name.toLowerCase());
    state.programs.push({ id: newId(), name });
  }
  field.value = '';
  render(); save();
}

function findTask(id){
  return state.active.find(t => t.id === id) || state.backlog.find(t => t.id === id);
}

// Copy a task to paste elsewhere (into Claude, to plan or resolve it): the
// text, and for a task on Now a second line saying how long it has sat
// there. Clipboard API first, a textarea fallback for WebViews without it.
function taskText(t){
  return state.active.includes(t) ? `${t.text}\nOn the Whiteboard's Now list for ${age(t)}.` : t.text;
}
function copyTask(id, btn){
  const t = findTask(id);
  if (!t) return;
  const text = taskText(t);
  const did = () => {
    btn.textContent = 'copied'; btn.classList.add('did');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('did'); }, 1200);
  };
  const fail = () => { $('status').textContent = 'Could not copy — select the text and copy it by hand.'; };
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(did, fail); return; }
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand && document.execCommand('copy'); } catch (e) {}
  ta.remove(); (ok ? did : fail)();
}

// Tap a task's text to edit it in place. Enter or tapping away saves; Escape
// or an empty field leaves the original text untouched. Editing never deletes.
function startEdit(span){
  // A program's name is edited the same way as a task's text (rename only —
  // there is no removing a program, as there is no deleting a task).
  const t = span.dataset.progEdit
    ? { get text(){ return this.p.name; }, set text(v){ this.p.name = v; }, p: state.programs.find(p => p.id === span.dataset.progEdit) }
    : findTask(span.dataset.edit);
  const input = document.createElement('input');
  input.className = 'edit';
  input.value = t.text;
  input.setAttribute('aria-label', 'Edit task');
  let finished = false;
  const finish = commit => {
    if (finished) return;
    finished = true;
    const text = input.value.trim();
    if (commit && text && text !== t.text){ t.text = text; save(); }
    render();
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
  span.replaceWith(input);
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

// Ticking a task is completion: the tick draws, the row fades, and the task
// leaves the board for the archive, stamped with when — kept, never shown on
// the board again. There is no undo.
function complete(id){
  const row = document.querySelector(`[data-row="${id}"]`);
  row.classList.add('done');
  row.querySelector('[data-done]').disabled = true;
  setTimeout(() => {
    const i = state.active.findIndex(t => t.id === id);
    if (i < 0) return;
    const [t] = state.active.splice(i, 1);
    delete t.since;
    t.done = Date.now();
    state.archive.unshift(t);
    render(); save();
  }, 480);
}

$('add').addEventListener('click', add);
$('field').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); add(); }
});
$('field').addEventListener('paste', pasteTasks);

$('prog-add').addEventListener('click', addPrograms);
$('prog-field').addEventListener('keydown', e => {
  // Enter adds; Shift+Enter (or a paste) makes a new line for several at once.
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); addPrograms(); }
});
document.addEventListener('change', e => {
  const sel = e.target.closest('[data-prog]');
  if (!sel) return;
  const t = findTask(sel.dataset.prog);
  if (!t) return;
  if (sel.value) t.program = sel.value; else delete t.program;
  render(); save();
});

document.addEventListener('click', e => {
  const push = e.target.closest('[data-push]');
  if (push && openCount() < 7){
    const i = state.backlog.findIndex(t => t.id === push.dataset.push);
    const [t] = state.backlog.splice(i, 1);
    t.since = Date.now();
    state.active.push(t);
    render(); save();
    return;
  }
  const done = e.target.closest('[data-done]');
  if (done && !done.disabled){ complete(done.dataset.done); return; }
  const copy = e.target.closest('[data-copy]');
  if (copy){ copyTask(copy.dataset.copy, copy); return; }
  if (e.target.id === 'export'){ exportOpen = true; render(); return; }
  if (e.target.id === 'export-close'){ exportOpen = false; render(); return; }
  if (e.target.id === 'export-copy'){ copyExport(); return; }
  const edit = e.target.closest('[data-edit],[data-prog-edit]');
  if (edit) startEdit(edit);
});

load();
renderKairos();
kairosRefresh();
$('kairos-save').addEventListener('click', kairosConnect);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') kairosRefresh();
});
// updateViaCache:'none' keeps the HTTP cache out of sw.js checks, and every
// return to the foreground forces one — belt and braces for WebViews that
// skip the automatic re-check.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') reg.update();
    });
  });
}
</script>
</body>
</html>

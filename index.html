<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The page may reach its own address only (v18, 2026-11-15: the Kairos door
     to GitHub, Charter v1.6, is closed). Any other host is refused. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Whiteboard">
<title>Whiteboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --board:#f6f7f5;
    --edge:#d3d6d1;
    --ink:#000000;
    --graphite:#5a6067;
    --blue:#1b54b8;
    --red:#d5322b;
    --green:#1f7a4c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.4;
    padding:20px 16px 56px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px;}
  h1{font-size:21px;font-weight:650;letter-spacing:-.3px;margin:0;}
  .count{font-size:14px;font-weight:600;color:var(--graphite);font-variant-numeric:tabular-nums;}
  .count.full{color:var(--red);}

  section{margin-bottom:34px;}
  h2{font-size:13px;font-weight:650;color:var(--graphite);margin:0 0 10px;letter-spacing:.1px;}

  .board{border:1.5px solid var(--edge);border-radius:10px;background:#fff;padding:4px 0;}
  .board.empty{padding:22px 16px;color:var(--graphite);font-size:14px;border-style:dashed;}

  .row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;}
  .row + .row{border-top:1px solid #ecefea;}
  .task{flex:1;font-size:16px;word-break:break-word;padding-top:1px;}

  .box{
    width:23px;height:23px;flex:none;margin-top:1px;border:2px solid var(--ink);
    border-radius:4px;background:#fff;cursor:pointer;padding:0;position:relative;
  }
  .box svg{position:absolute;inset:-3px;width:29px;height:29px;stroke:var(--green);
    stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:32;stroke-dashoffset:32;}
  .done .box{border-color:var(--graphite);}
  .done .box svg{stroke-dashoffset:0;transition:stroke-dashoffset .22s ease-out;}
  .done .task{color:var(--graphite);text-decoration:line-through;text-decoration-color:#b9bdb7;}
  .done{opacity:.35;transition:opacity .25s ease-out .2s;}
  .task{cursor:text;}
  .edit{
    flex:1;min-width:0;font:inherit;font-size:16px;padding:0;margin:0;border:none;border-bottom:1.5px solid var(--ink);
    background:transparent;color:var(--ink);border-radius:0;
  }
  .edit:focus{outline:none;border-color:var(--ink);}
  .backlog .edit{font-size:15px;}

  .push{
    flex:none;border:1.5px solid var(--blue);color:var(--blue);background:#fff;
    font:inherit;font-size:13px;font-weight:600;border-radius:6px;padding:5px 11px;cursor:pointer;
  }
  .push:disabled{border-color:var(--edge);color:#adb2ac;cursor:not-allowed;}

  .capture{display:flex;gap:8px;margin-bottom:12px;}
  input{
    flex:1;font:inherit;font-size:16px;padding:11px 13px;background:#fff;
    border:1.5px solid var(--edge);border-radius:8px;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--ink);}
  .add{border:none;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:600;
    border-radius:8px;padding:0 16px;cursor:pointer;}

  .backlog .row{padding:11px 2px;}
  .backlog .row + .row{border-top:1px solid #e6e9e4;}
  .backlog .task{font-size:15px;}
  .note{font-size:13px;color:var(--graphite);margin:10px 2px 0;}
  .age{flex:none;font-size:12px;color:var(--graphite);font-variant-numeric:tabular-nums;padding-top:4px;white-space:nowrap;}
  .copy{flex:none;font:inherit;font-size:12px;color:var(--graphite);background:#fff;border:1.5px solid var(--edge);border-radius:6px;padding:3px 8px;cursor:pointer;}
  .copy.did{color:var(--green);border-color:var(--green);}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .prog{align-self:flex-start;max-width:100%;font:inherit;font-size:12px;color:var(--graphite);background:#fff;
    border:1.5px solid var(--edge);border-radius:6px;padding:2px 4px;}
  .prog.set{color:var(--blue);border-color:#b8c8e6;}
  #field-prog-slot .prog{display:block;margin:-4px 0 12px;}
  details{margin-bottom:22px;}
  summary{font-size:13px;font-weight:650;color:var(--graphite);cursor:pointer;padding:4px 0;}
  .archive .row,.programs .row{padding:9px 2px;}
  .archive .row + .row,.programs .row + .row{border-top:1px solid #e6e9e4;}
  .archive .task{font-size:14px;color:var(--graphite);cursor:default;}
  .archive .meta{display:block;font-size:12px;color:var(--graphite);opacity:.8;}
  .programs .task{font-size:14px;}
  .programs textarea{flex:1;font:inherit;font-size:15px;padding:9px 12px;background:#fff;resize:vertical;
    border:1.5px solid var(--edge);border-radius:8px;color:var(--ink);min-height:44px;}
  .programs textarea:focus{outline:none;border-color:var(--ink);}
  /* Export for agent (Agent design 5): the document shown before it is copied */
  .export{margin-top:22px;}
  .export .xdoc{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1.5px solid var(--edge);border-radius:8px;padding:10px 12px;margin:8px 0 0;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto;}
  .export .btns{display:flex;gap:8px;margin-top:8px;}
  /* Kairos (Pace 6): the dashboard issue, synced with the board */
  .kairos{margin-top:22px;}
  .kairos details{margin:10px 0 0;}
  .stuck{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--red);margin-top:4px;}
  .stuck .copy.talk{color:var(--blue);border-color:var(--blue);}
  .from{display:block;font-size:12px;color:var(--graphite);opacity:.8;margin-top:2px;}
  .kairos input{min-width:0;}
  /* A group (Whiteboard flow 3): a task's steps under its text */
  .steps{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .step{display:flex;align-items:flex-start;gap:8px;font-size:14px;}
  .step .box{width:19px;height:19px;border-width:1.5px;}
  .step .box svg{inset:-3px;width:23px;height:23px;}
  .step .mark{width:19px;height:19px;flex:none;}
  .step .mark svg{width:19px;height:19px;stroke:var(--green);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .step.ticked .task{color:var(--graphite);text-decoration:line-through;text-decoration-color:#b9bdb7;}
  .steps-edit{display:flex;gap:8px;margin-top:4px;}
  .steps-edit textarea{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 10px;background:#fff;resize:vertical;
    border:1.5px solid var(--edge);border-radius:8px;color:var(--ink);}
  .steps-edit textarea:focus{outline:none;border-color:var(--ink);}
  .grow{align-self:flex-start;}
  /* What fits the time I have (Whiteboard flow 4) */
  .have{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:13px;color:var(--graphite);}
  .have button{font:inherit;font-size:13px;font-weight:600;color:var(--graphite);background:#fff;border:1.5px solid var(--edge);border-radius:6px;padding:4px 10px;cursor:pointer;}
  .have button.on{color:#fff;background:var(--ink);border-color:var(--ink);}
  .row.faded{opacity:.35;}
  .pickers{display:flex;flex-wrap:wrap;gap:6px;}
  .step .size{margin-left:auto;flex:none;max-width:86px;font-size:11px;padding:1px 2px;}
  .pickers .steps-edit{flex-basis:100%;}
  .pickers .copy{padding:2px 8px;}
  .copy.offer{color:var(--blue);border-color:var(--blue);}
  .ver{position:fixed;right:10px;bottom:8px;font-size:11px;color:var(--graphite);opacity:.6;}
  .saving{font-size:12px;color:var(--graphite);}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .label{display:block;font-size:12px;color:var(--graphite);margin-top:3px;}
  .ice{flex:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Whiteboard</h1>
  </header>

  <section class="backlog">
    <div class="capture">
      <input id="field" placeholder="Add a task" autocomplete="off" enterkeyhint="done">
      <button class="add" id="add" type="button">Add</button>
    </div>
    <div id="field-prog-slot"></div>
    <p class="note" id="status"></p>
  </section>

  <section>
    <h2>Ready</h2>
    <div class="board" id="ready"></div>
  </section>

  <details class="archive" id="icebox-box">
    <summary id="icebox-head">Icebox</summary>
    <div id="icebox"></div>
  </details>

  <details class="archive" id="archive-box">
    <summary id="archive-head">Archive</summary>
    <div id="archive"></div>
  </details>

  <details class="programs" id="programs-box">
    <summary id="programs-head">Programs</summary>
    <div class="capture">
      <textarea id="prog-field" rows="1" placeholder="Add programs, one per line" autocomplete="off"></textarea>
      <button class="add" id="prog-add" type="button">Add</button>
    </div>
    <div id="programs"></div>
  </details>
</div>
<!-- Keep in step with CACHE in sw.js — the visible proof of which build is running. -->
<span class="ver">whiteboard-v18</span>

<script>
// Whiteboard v18 (N., 2026-11-15): Ready and a hidden Icebox, nothing more.
// Six weeks showed the board works as a passive menu, opened briefly on the
// phone: it remembers tasks and lets me pick. Now, its cap, the time chips,
// sizes, ages, copy, Talk it through, blocked, let go, the export and the
// Kairos sync are gone from the screen; their stored fields stay on the
// tasks, unread, so the v17 backup (below) can bring them back.
const KEY = 'whiteboard:v1';
const BACKUP = 'whiteboard:v17-backup';         // the v17 board, as it was, before v18 first moved anything
const TOKEN_KEY = 'whiteboard:kairos-token';    // the old GitHub token: deleted, the door is closed
// ready, icebox: open tasks, newest first. archive: ticked (or let go in v17),
// newest first, each with `done`. programs: {id, name}. offBoard: the open
// Kairos steps v17 had brought in, kept out of sight. active, backlog: v17's
// lists, empty since the move.
let state = { ready: [], icebox: [], archive: [], programs: [] };

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const plural = (n, one) => `${n} ${one}${n === 1 ? '' : 's'}`;
const programName = id => (state.programs.find(p => p.id === id) || {}).name || '';
const hasSteps = t => Array.isArray(t.steps) && t.steps.length > 0;
const TICK = '<svg viewBox="0 0 29 29"><path d="M7 15.2 12.2 20.4 22 9.4"/></svg>';
// The day a task was ticked: "3 Oct", with the year once it is not this year's.
const doneDay = ms => {
  const d = new Date(ms), opts = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('en-GB', opts);
};

// The move to v18, once: the v17 board is backed up unchanged on the phone,
// then every open task I added goes to the Icebox (blocked ones too) and
// Ready starts empty; open Kairos steps leave the board into offBoard; the
// archive stays as it is. Nothing of the board leaves the phone.
function migrate(raw){
  if (raw && !localStorage.getItem(BACKUP)) localStorage.setItem(BACKUP, raw);
  const open = (state.active || []).concat(state.backlog || []);
  const mine = open.filter(t => !t.kairos), kairos = open.filter(t => t.kairos);
  state.icebox = mine.concat(state.icebox || []);
  state.offBoard = (state.offBoard || []).concat(kairos);
  state.ready = state.ready || [];
  state.active = [];
  state.backlog = [];
  state.v = 18;
  return open.length ? `Whiteboard v18: ${plural(mine.length, 'task')} to the Icebox; ${plural(kairos.length, 'Kairos task')} taken off the board.` : '';
}

function load(){
  let raw = null, note = '';
  try {
    raw = localStorage.getItem(KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) {
    note = 'Starting a fresh board.';
  }
  for (const k of ['ready', 'icebox', 'archive']) if (!Array.isArray(state[k])) state[k] = [];
  if (!Array.isArray(state.programs)) state.programs = [];
  let changed = !raw;
  if (state.v !== 18){ note = migrate(raw) || note; changed = true; }
  try { if (localStorage.getItem(TOKEN_KEY) != null) localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  render();
  if (changed) save();
  $('status').textContent = note;
}

function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    $('status').textContent = 'Not saved — this browser is blocking storage.';
  }
}

const label = t => t.program && programName(t.program) ? `<span class="label">${esc(programName(t.program))}</span>` : '';
const stepsOf = t => !hasSteps(t) ? '' : `<div class="steps">${t.steps.map(s => `
  <div class="step${s.done ? ' ticked' : ''}"><span class="mark">${s.done ? TICK : ''}</span><span class="task">${esc(s.text)}</span></div>`).join('')}</div>`;

function render(){
  const r = $('ready');
  if (!state.ready.length){
    r.className = 'board empty';
    r.textContent = 'Nothing ready. Move something up from the Icebox.';
  } else {
    r.className = 'board';
    r.innerHTML = state.ready.map(t => `
      <div class="row" data-row="${t.id}">
        <button class="box" data-done="${t.id}" aria-label="Complete ${esc(t.text)}">${TICK}</button>
        <div class="body"><span class="task" data-edit="${t.id}">${esc(t.text)}</span>${stepsOf(t)}${label(t)}</div>
        <button class="copy ice" data-ice="${t.id}" aria-label="Move ${esc(t.text)} to the Icebox">Icebox</button>
      </div>`).join('');
  }

  // The picker beside "Add a task": a new task takes its program as it is typed.
  const slot = $('field-prog-slot'), was = $('field-prog') ? $('field-prog').value : '';
  slot.innerHTML = state.programs.length
    ? `<select class="prog" id="field-prog" aria-label="Program for the new task"><option value="">no program</option>${state.programs.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`
    : '';
  if ($('field-prog') && state.programs.some(p => p.id === was)) $('field-prog').value = was;

  $('icebox-head').textContent = `Icebox · ${state.icebox.length}`;
  $('icebox').innerHTML = state.icebox.length
    ? state.icebox.map(t => `
      <div class="row" data-row="${t.id}">
        <span class="task">${esc(t.text)}${label(t)}</span>
        <button class="push" data-unice="${t.id}" aria-label="Move ${esc(t.text)} to Ready">Ready</button>
      </div>`).join('')
    : '<p class="note">Empty.</p>';

  $('archive-head').textContent = `Archive · ${state.archive.length}`;
  $('archive').innerHTML = state.archive.length
    ? state.archive.map(t => `
      <div class="row" data-row="${t.id}">
        <span class="task">${esc(t.text)}<span class="meta">${t.letGo ? 'let go · ' : ''}${doneDay(t.done)}${t.program && programName(t.program) ? ' · ' + esc(programName(t.program)) : ''}${hasSteps(t) ? ' · ' + plural(t.steps.length, 'step') : ''}</span></span>
      </div>`).join('')
    : '<p class="note">Nothing ticked off yet.</p>';

  $('programs-head').textContent = `Programs · ${state.programs.length}`;
  $('programs').innerHTML = state.programs.length
    ? state.programs.map(p => `
      <div class="row"><span class="task" data-prog-edit="${p.id}">${esc(p.name)}</span></div>`).join('')
    : '<p class="note">None yet. Add the programs you do Whiteboard tasks for.</p>';
}

function add(){
  const field = $('field');
  const text = field.value.trim();
  if (!text) return;
  const t = { id: newId(), text, added: Date.now() };
  const prog = $('field-prog');
  if (prog && prog.value) t.program = prog.value;
  state.ready.unshift(t);
  field.value = '';
  if (prog) prog.value = '';
  field.focus();
  render(); save();
}

// A pasted list, one item per line: list bullets are stripped, and a
// heading line ending in ":" and an empty line are skipped.
const listLines = text => text.split(/\r?\n/)
  .map(line => line.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim())
  .filter(line => line && !line.endsWith(':'));

// Several lines pasted into the task field: one Ready task each, in the
// list's order; one already open (any case) is not added twice.
function pasteTasks(e){
  const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
  if (!/\n/.test(text.trim())) return;
  e.preventDefault();
  const have = new Set([...state.ready, ...state.icebox].map(t => t.text.toLowerCase()));
  const fresh = [];
  for (const line of listLines(text)){
    if (have.has(line.toLowerCase())) continue;
    have.add(line.toLowerCase());
    fresh.push({ id: newId(), text: line, added: Date.now() });
  }
  state.ready.unshift(...fresh);
  render(); save();
  $('status').textContent = `${plural(fresh.length, 'task')} added from the list.`;
}

function addPrograms(){
  const field = $('prog-field');
  const have = new Set(state.programs.map(p => p.name.toLowerCase()));
  for (const name of listLines(field.value)){
    if (have.has(name.toLowerCase())) continue;
    have.add(name.toLowerCase());
    state.programs.push({ id: newId(), name });
  }
  field.value = '';
  render(); save();
}

// Ready to the top of the Icebox, or the Icebox to the top of Ready.
function move(id, from, to){
  const i = state[from].findIndex(t => t.id === id);
  if (i < 0) return;
  const [t] = state[from].splice(i, 1);
  state[to].unshift(t);
  render(); save();
}

// Tap a task's text (or a program's name) to edit it in place. Enter or
// tapping away saves; Escape or an empty field keeps the original.
function startEdit(span){
  const t = span.dataset.progEdit
    ? { get text(){ return this.p.name; }, set text(v){ this.p.name = v; }, p: state.programs.find(p => p.id === span.dataset.progEdit) }
    : state.ready.find(x => x.id === span.dataset.edit);
  if (!t) return;
  const input = document.createElement('input');
  input.className = 'edit';
  input.value = t.text;
  input.setAttribute('aria-label', 'Edit');
  let finished = false;
  const finish = commit => {
    if (finished) return;
    finished = true;
    const text = input.value.trim();
    if (commit && text && text !== t.text){ t.text = text; save(); }
    render();
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
  span.replaceWith(input);
  input.focus();
}

// Ticking a task completes it: the tick draws, the row fades, and it goes to
// the archive, stamped with when. There is no undo.
function complete(id){
  const row = document.querySelector(`#ready [data-row="${id}"]`);
  if (!row) return;
  row.classList.add('done');
  row.querySelector('[data-done]').disabled = true;
  setTimeout(() => {
    const i = state.ready.findIndex(t => t.id === id);
    if (i < 0) return;
    const [t] = state.ready.splice(i, 1);
    t.done = Date.now();
    state.archive.unshift(t);
    render(); save();
  }, 480);
}

$('add').addEventListener('click', add);
$('field').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); add(); }
});
$('field').addEventListener('paste', pasteTasks);
$('prog-add').addEventListener('click', addPrograms);
$('prog-field').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); addPrograms(); }
});

document.addEventListener('click', e => {
  const done = e.target.closest('[data-done]');
  if (done && !done.disabled){ complete(done.dataset.done); return; }
  const ice = e.target.closest('[data-ice]');
  if (ice){ move(ice.dataset.ice, 'ready', 'icebox'); return; }
  const unice = e.target.closest('[data-unice]');
  if (unice){ move(unice.dataset.unice, 'icebox', 'ready'); return; }
  const edit = e.target.closest('[data-edit],[data-prog-edit]');
  if (edit) startEdit(edit);
});

load();
// updateViaCache:'none' keeps the HTTP cache out of sw.js checks, and every
// return to the foreground forces one — belt and braces for WebViews that
// skip the automatic re-check.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') reg.update();
    });
  });
}
</script>
</body>
</html>
